[env]
TERM = "alacritty"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
opacity = 1

[scrolling]
history = 100000

[font]
size = 11.0
[font.offset]
x = 1
y = 0

[font.glyph_offset]
x = 0
y = 0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style  = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style  = "Bold"

[colors.primary]
background = "#0b0f14"
foreground = "#e6eef6"

[colors.cursor]
cursor = "#996BFF"
text = "#0b0f14"

[colors.selection]
background = "#2a3140"
text = "CellForeground"

[[keyboard.bindings]]
key = "B"
mods = "Control"
chars = "\u0002"

[[keyboard.bindings]]
key = "Slash"
mods = "Control"
chars = "\u001F"

[[keyboard.bindings]]
key = "Space"
mods = "Control"
chars = "\u0000"