set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB"
set -ga terminal-features ",alacritty:RGB"

set-window-option -g mode-keys vi

# ─── Status bar ──────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0b0f14,fg=#e6eef6"

set -g focus-events on

# Left: session ▸ pane ▸ path ▸ git branch
set -g status-left-length 200
set -g status-left "#[fg=#0b0f14,bg=#63c285,bold] #S #[fg=#63c285,bg=#2bd4ff,nobold]#[fg=#0b0f14,bg=#2bd4ff,bold] #P #[fg=#2bd4ff,bg=#3b4252]#[fg=#e6eef6,bg=#3b4252] 󰉋 #(echo '#{pane_current_path}' | sed \"s|^$HOME|~|\" | awk -F/ '{if(NF>3)print \"…/\"$(NF-1)\"/\"$NF; else print $0}') #[fg=#3b4252,bg=#2a2f3a]#[fg=#ffb86b,bg=#2a2f3a] 󰘬 #[fg=#e6eef6]#(cd '#{pane_current_path}' 2>/dev/null && git symbolic-ref --short HEAD 2>/dev/null || echo '—') #[fg=#2a2f3a,bg=#0b0f14] "

# Window list (center)
set -g window-status-separator ""
set -g window-status-format "#[fg=#5c6370,bg=#0b0f14]  #I #[fg=#7a8290]#W  "
set -g window-status-current-format "#[fg=#0b0f14,bg=#ff9f43,bold] 󰓩 #I  #W #[fg=#ff9f43,bg=#0b0f14,nobold]"

# Right: git status ▸ host ▸ time ▸ prefix flag
set -g status-right-length 200
set -g status-right "#[fg=#2a2f3a,bg=#0b0f14]#[fg=#e6eef6,bg=#2a2f3a] #(cd '#{pane_current_path}' 2>/dev/null && git status --porcelain 2>/dev/null | awk 'BEGIN{c=0} {c++} END{if(c>0) printf \"±%d\", c; else printf \"✓\"}' || echo '—') #[fg=#3b4252,bg=#2a2f3a]#[fg=#e6eef6,bg=#3b4252] #h #[fg=#2bd4ff,bg=#3b4252]#[fg=#0b0f14,bg=#2bd4ff,bold] %H:%M #[fg=#ff9f43,bg=#2bd4ff]#[bg=#ff9f43,bold]#{?client_prefix,#[fg=#e74c3c],#[fg=#0b0f14]}  "

# Pane borders
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#996BFF"

# Messages
set -g message-style "bg=#ff9f43,fg=#0b0f14,bold"
set -g message-command-style "bg=#2bd4ff,fg=#0b0f14,bold"

# ─── Prefix keys ─────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-_                # Ctrl+/
set-option -g prefix2 M-z
bind-key C-_ send-prefix
bind-key M-z send-prefix -2

# ─── Pane navigation ─────────────────────────────────────────────────────────
# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Alt-Shift-arrow without prefix
bind -n M-S-Left previous-window
bind -n M-S-Right next-window

# ─── Reload ──────────────────────────────────────────────────────────────────
bind r display-message "Sourcing ~/.tmux.conf" \; source-file "$HOME/.tmux.conf"
