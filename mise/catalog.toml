# Tools declare their group membership in tools/*.toml.
[groups.core]
label = "Core shell and runtimes, always selected"

[groups.development]
label = "Development tools"

[groups.coding-agents]
label = "Coding agents"

[groups.jmunch]
label = "Licensed jmunch MCP servers"

[groups.markitdown]
label = "MarkItDown CLI and MCP server"

[groups.workflow]
label = "Workflow tools"

[groups.personal]
label = "Personal tools"

[profiles.terumo]
label = "Terumo"
groups = ["development", "markitdown"]
tools = ["opencode", "pi", "copilot", "herdr"]

[profiles.gbl]
label = "GBL"
groups = ["development", "coding-agents", "jmunch", "workflow"]
tools = []

[profiles.core]
label = "Core only"
groups = []
tools = []
